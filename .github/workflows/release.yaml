# This workflow will open a pull request bumping the version and updating the changelog, then release the new version once merged
# For more information see: https://commitizen-tools.github.io/commitizen/tutorials/github_actions/

name: Bump version

on:
  push:
    branches: [ main ]

jobs:
  release:
    name: "Release the new version merged on main"
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check if the version is already released
      id: version
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
          echo "released=true" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Extract the release notes from the changelog
      if: steps.version.outputs.released == 'false'
      run: |
        awk -v version="$VERSION" '/^## / { if (found) exit; found = ($2 == version) } found' CHANGELOG.md > body.md
      env:
        VERSION: ${{ steps.version.outputs.version }}
    - name: Release
      if: steps.version.outputs.released == 'false'
      uses: softprops/action-gh-release@v3
      with:
        body_path: body.md
        tag_name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
    # A tag created with GITHUB_TOKEN does not trigger the publish workflow
    - name: Publish
      if: steps.version.outputs.released == 'false'
      run: gh workflow run publish.yaml --ref "$VERSION"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}

  bump-version:
    name: "Open the pull request bumping the version with commitizen"
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # Exit codes 3 and 21 mean that no commit requires a new version
    - name: Bump the version and update the changelog
      uses: commitizen-tools/commitizen-action@0.27.1
      with:
        commit: false
        push: false
        no_raise: "3,21"
        changelog_increment_filename: body.md
        git_redirect_stderr: true
    - name: Open or update the pull request
      if: env.REVISION != env.PREVIOUS_REVISION
      uses: peter-evans/create-pull-request@v8
      with:
        branch: bump-version
        add-paths: |
          CHANGELOG.md
          pyproject.toml
          uv.lock
        commit-message: "bump: version ${{ env.PREVIOUS_REVISION }} → ${{ env.REVISION }}"
        title: "bump: version ${{ env.PREVIOUS_REVISION }} → ${{ env.REVISION }}"
        body-path: body.md
