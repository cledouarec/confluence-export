# This workflow will bump the version, update the changelog, create a release on GitHub and trigger its publication
# For more information see: https://commitizen-tools.github.io/commitizen/tutorials/github_actions/

name: Bump version

on:
  push:
    branches: [ main ]

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    name: "Bump version and create changelog with commitizen"
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Create bump and changelog
      uses: commitizen-tools/commitizen-action@0.27.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        changelog_increment_filename: body.md
        git_redirect_stderr: true
    - name: Release
      if: env.REVISION != env.PREVIOUS_REVISION
      uses: softprops/action-gh-release@v3
      with:
        body_path: body.md
        tag_name: ${{ env.REVISION }}
    # A tag pushed with GITHUB_TOKEN does not trigger the publish workflow
    - name: Publish
      if: env.REVISION != env.PREVIOUS_REVISION
      run: gh workflow run publish.yaml --ref "$REVISION"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
