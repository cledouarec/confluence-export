[project]
name = "confluence-exporter"
version = "0.2.1"
description = "Export Confluence page and convert to others formats"
readme = "README.md"
authors = [
    { name = "Christophe Le Douarec", email = "ledouarec@gmail.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["confluence", "atlassian", "extractor"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "atlassian-python-api>=3.28,<5",
    "PyPDF2>=2.11,<4",
    "python-dotenv>=0.21,<2",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/cledouarec/confluence-export"

[project.scripts]
confluence-export = "confluenceexport.cli:main"

[dependency-groups]
dev = [
    "commitizen",
    "coverage",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "confluenceexport"
source-include = ["CHANGELOG.md", "tests/**"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
update_changelog_on_bump = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",                     # copyright headers
    "missing-trailing-comma",  # conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert", "implicit-namespace-package"]
