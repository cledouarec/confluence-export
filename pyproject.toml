[project]
name = "confluence-exporter"
version = "0.2.0"
description = "Export Confluence page and convert to others formats"
readme = "README.md"
authors = [
    { name = "Christophe Le Douarec", email = "ledouarec@gmail.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["confluence", "atlassian", "extractor"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "atlassian-python-api>=3.28,<5",
    "PyPDF2>=2.11,<4",
    "python-dotenv>=0.21,<2",
    "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/cledouarec/confluence-export"

[project.scripts]
confluence-export = "confluenceexport.cli:main"

[dependency-groups]
dev = [
    "coverage",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "confluenceexport"
source-include = ["tests/**"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''
